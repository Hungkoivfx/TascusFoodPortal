<!DOCTYPE html>

<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài Kiểm tra Quy trình làm việc - Tascus Food</title>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
    * {
        box-sizing: border-box;
    }

    html {
        scroll-behavior: smooth;
    }

    body {
        margin: 0;
        background: #f5f6f8;
        color: #202124;
        font-family: 'Inter', sans-serif;
    }

    .container {
        width: min(900px, calc(100% - 32px));
        margin: 0 auto;
        padding: 32px 0 50px;
    }

    .card {
        background: #ffffff;
        border: 1px solid #e3e5e8;
        border-radius: 16px;
        padding: 28px;
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.04);
    }

    .hidden {
        display: none !important;
    }

    .loading {
        text-align: center;
        margin-top: 80px;
        color: #666;
    }

    .error {
        margin-top: 40px;
        border-color: #e2b8b8;
        background: #fff7f7;
        color: #9b1c1c;
    }

    .header {
        text-align: center;
        margin-bottom: 28px;
    }

    .brand {
        font-size: 14px;
        font-weight: 800;
        letter-spacing: 0.08em;
        color: #111;
        text-transform: uppercase;
        margin-bottom: 10px;
    }

    h1 {
        margin: 0;
        font-size: 28px;
        line-height: 1.3;
    }

    h2 {
        margin: 0;
        font-size: 22px;
    }

    .description {
        margin: 14px auto 0;
        max-width: 700px;
        color: #6b7280;
        line-height: 1.6;
        font-size: 14px;
    }

    .form-group {
        margin-top: 28px;
    }

    .form-group label {
        display: block;
        margin-bottom: 8px;
        font-size: 14px;
        font-weight: 700;
    }

    input[type="text"] {
        width: 100%;
        height: 48px;
        border: 1px solid #d6d9de;
        border-radius: 10px;
        padding: 0 14px;
        font: inherit;
        font-size: 16px;
        outline: none;
        transition: border-color 0.15s, box-shadow 0.15s;
    }

    input[type="text"]:focus {
        border-color: #111;
        box-shadow: 0 0 0 3px rgba(17, 17, 17, 0.08);
    }

    .info-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
        margin-top: 24px;
    }

    .info-item {
        background: #f7f8fa;
        border-radius: 12px;
        padding: 16px 12px;
        text-align: center;
    }

    .info-value {
        display: block;
        font-size: 20px;
        font-weight: 800;
        margin-bottom: 5px;
    }

    .info-label {
        color: #6b7280;
        font-size: 12px;
    }

    .btn {
        border: 0;
        border-radius: 10px;
        min-height: 48px;
        padding: 0 22px;
        font-family: inherit;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.1s, opacity 0.15s;
    }

    .btn:active {
        transform: scale(0.98);
    }

    .btn-primary {
        background: #111;
        color: #fff;
    }

    .btn-primary:hover {
        opacity: 0.88;
    }

    .btn-danger {
        background: #b42318;
        color: #fff;
    }

    .start-actions {
        margin-top: 28px;
        text-align: center;
    }

    /* TEST HEADER */

    .test-header {
        position: sticky;
        top: 0;
        z-index: 20;
        background: rgba(245, 246, 248, 0.96);
        backdrop-filter: blur(8px);
        padding: 10px 0 12px;
    }

    .test-status {
        width: min(900px, calc(100% - 32px));
        margin: 0 auto;
        display: flex;
        align-items: center;
        gap: 16px;
    }

    .progress-area {
        flex: 1;
        min-width: 0;
    }

    .progress-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 7px;
    }

    .question-counter {
        flex: 0 0 auto;
        font-size: 13px;
        font-weight: 800;
        white-space: nowrap;
    }

    .progress {
        width: 100%;
        height: 7px;
        background: #e1e4e8;
        border-radius: 99px;
        overflow: hidden;
    }

    .progress-bar {
        height: 100%;
        width: 0%;
        background: #111;
        border-radius: inherit;
        transition: width 0.2s ease;
    }

    .timer {
        flex: 0 0 auto;
        min-width: 92px;
        height: 42px;
        padding: 0 13px;
        border-radius: 10px;
        background: #fff;
        border: 1px solid #dfe2e6;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        font-size: 15px;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
    }

    .timer.warning {
        color: #a15c00;
        border-color: #e3bd82;
        background: #fffaf1;
    }

    .timer.danger {
        color: #b42318;
        border-color: #e3aaaa;
        background: #fff5f5;
    }

    /* QUESTION */

    .question-card {
        margin-top: 16px;
    }

    .question-number {
        font-size: 13px;
        font-weight: 800;
        color: #6b7280;
        margin-bottom: 10px;
    }

    .question-text {
        font-size: 20px;
        line-height: 1.5;
        font-weight: 700;
        margin-bottom: 24px;
    }

    .options {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .option {
        position: relative;
    }

    .option input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
    }

    .option label {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        padding: 15px;
        border: 1px solid #dfe2e6;
        border-radius: 12px;
        cursor: pointer;
        line-height: 1.5;
        transition: border-color 0.15s, background 0.15s;
    }

    .option label:hover {
        background: #fafafa;
    }

    .option input:checked + label {
        border-color: #111;
        background: #f5f5f5;
    }

    .option-letter {
        flex: 0 0 30px;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: #f0f1f3;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        font-weight: 800;
    }

    .option input:checked + label .option-letter {
        background: #111;
        color: #fff;
    }

    .option-text {
        padding-top: 3px;
        font-size: 14px;
    }

    .navigation {
        display: flex;
        justify-content: flex-end;
        margin-top: 22px;
    }

    .question-warning {
        color: #b42318;
        font-size: 13px;
        font-weight: 600;
        margin-top: 10px;
        min-height: 18px;
    }

    /* RESULT */

    .result-header {
        text-align: center;
    }

    .score {
        font-size: 56px;
        line-height: 1;
        font-weight: 800;
        margin: 22px 0 8px;
    }

    .score-label {
        color: #6b7280;
        font-size: 14px;
    }

    .result-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin-top: 28px;
    }

    .result-item {
        background: #f7f8fa;
        border-radius: 12px;
        padding: 18px 12px;
        text-align: center;
    }

    .result-item strong {
        display: block;
        font-size: 24px;
        margin-bottom: 5px;
    }

    .result-item span {
        color: #6b7280;
        font-size: 12px;
    }

    .result-message {
        margin-top: 24px;
        padding: 16px;
        border-radius: 10px;
        background: #f7f8fa;
        text-align: center;
        line-height: 1.6;
        font-size: 14px;
    }

    @media (max-width: 600px) {
        .container {
            width: min(100% - 20px, 900px);
            padding-top: 20px;
        }

        .card {
            padding: 20px;
            border-radius: 13px;
        }

        h1 {
            font-size: 22px;
        }

        .info-grid {
            grid-template-columns: repeat(2, 1fr);
        }

        .test-status {
            width: calc(100% - 20px);
            gap: 10px;
        }

        .timer {
            min-width: 78px;
            height: 40px;
            padding: 0 9px;
            font-size: 13px;
        }

        .progress-top {
            margin-bottom: 5px;
        }

        .question-counter {
            font-size: 12px;
        }

        .question-text {
            font-size: 18px;
        }

        .result-grid {
            grid-template-columns: 1fr;
        }
    }

    @media (max-width: 360px) {
        .test-status {
            gap: 7px;
        }

        .timer {
            min-width: 70px;
            font-size: 12px;
        }

        .question-counter {
            font-size: 11px;
        }
    }
</style>


</head>

<body>

<div id="loading" class="container">
    <div class="card loading">
        Đang tải dữ liệu bài test...
    </div>
</div>

<div id="error" class="container hidden">
    <div class="card error">
        <strong>Không thể tải bài test.</strong>
        <div id="errorMessage" style="margin-top:10px;"></div>
    </div>
</div>

<!-- START -->

<div id="startScreen" class="container hidden">
    <div class="header">
        <div class="brand">TASCUS FOOD</div>
        <h1 id="testTitle">Bài Test Đào Tạo</h1>
        <div id="testDescription" class="description"></div>
    </div>


<div class="card">
    <div class="form-group">
        <label for="employeeName">Họ và tên nhân viên</label>
        <input
            type="text"
            id="employeeName"
            placeholder="Nhập họ và tên"
            autocomplete="name"
            maxlength="100"
        >
    </div>

    <div class="info-grid">
        <div class="info-item">
            <span id="totalQuestions" class="info-value">80</span>
            <span class="info-label">Câu hỏi</span>
        </div>

        <div class="info-item">
            <span id="sopCount" class="info-value">60</span>
            <span class="info-label">Câu SOP</span>
        </div>

        <div class="info-item">
            <span id="cookingCount" class="info-value">20</span>
            <span class="info-label">Câu công thức</span>
        </div>

        <div class="info-item">
            <span class="info-value">10</span>
            <span class="info-label">Phút</span>
        </div>
    </div>

    <div class="start-actions">
        <button id="startButton" class="btn btn-primary">
            Bắt đầu bài test
        </button>
    </div>
</div>


</div>

<!-- TEST -->

<div id="testScreen" class="hidden">


<div class="test-header">
    <div class="test-status">

        <div class="progress-area">
            <div class="progress-top">
                <div id="questionCounter" class="question-counter">
                    Câu 1/80
                </div>
            </div>

            <div class="progress">
                <div id="progressBar" class="progress-bar"></div>
            </div>
        </div>

        <div id="timer" class="timer">
            <span>⏱</span>
            <span id="timerText">10:00</span>
        </div>

    </div>
</div>

<main class="container">
    <div class="card question-card">

        <div id="questionNumber" class="question-number">
            CÂU 1
        </div>

        <div id="questionText" class="question-text"></div>

        <div id="options" class="options"></div>

        <div id="questionWarning" class="question-warning"></div>

        <div class="navigation">
            <button id="nextButton" class="btn btn-primary">
                Câu tiếp theo
            </button>
        </div>

    </div>
</main>


</div>

<!-- RESULT -->

<div id="resultScreen" class="container hidden">


<div class="card">

    <div class="result-header">
        <div class="brand">TASCUS FOOD</div>
        <h2>Đã hoàn thành bài test</h2>

        <div id="score" class="score">0%</div>
        <div class="score-label">Kết quả bài kiểm tra</div>
    </div>

    <div class="result-grid">
        <div class="result-item">
            <strong id="correctCount">0</strong>
            <span>Câu đúng</span>
        </div>

        <div class="result-item">
            <strong id="wrongCount">0</strong>
            <span>Câu sai</span>
        </div>

        <div class="result-item">
            <strong id="resultTotal">80</strong>
            <span>Tổng số câu</span>
        </div>
    </div>

    <div id="resultMessage" class="result-message"></div>

</div>


</div>

<script>
    const QUESTIONS_FILE = './questions.json';

    // Để trống nếu chưa kết nối Apps Script.
    // Khi backend hoàn thiện, điền URL Web App của Apps Script vào đây.
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwTYZLr0z1T40RmuWRnfeQ3A6LXFf3xTw-wPymfu7JleDOlpFN3k07LhDUcus6Y_SrP_w/exec';

    const TEST_DURATION = 10 * 60;

    let testData = null;
    let questions = [];
    let currentQuestion = 0;
    let answers = [];
    let remainingSeconds = TEST_DURATION;
    let timerInterval = null;
    let testStartedAt = null;

    const loading = document.getElementById('loading');
    const error = document.getElementById('error');
    const errorMessage = document.getElementById('errorMessage');

    const startScreen = document.getElementById('startScreen');
    const testScreen = document.getElementById('testScreen');
    const resultScreen = document.getElementById('resultScreen');

    const employeeName = document.getElementById('employeeName');
    const startButton = document.getElementById('startButton');

    const testTitle = document.getElementById('testTitle');
    const testDescription = document.getElementById('testDescription');

    const totalQuestions = document.getElementById('totalQuestions');
    const sopCount = document.getElementById('sopCount');
    const cookingCount = document.getElementById('cookingCount');

    const questionCounter = document.getElementById('questionCounter');
    const progressBar = document.getElementById('progressBar');
    const timer = document.getElementById('timer');
    const timerText = document.getElementById('timerText');

    const questionNumber = document.getElementById('questionNumber');
    const questionText = document.getElementById('questionText');
    const options = document.getElementById('options');
    const questionWarning = document.getElementById('questionWarning');
    const nextButton = document.getElementById('nextButton');

    const score = document.getElementById('score');
    const correctCount = document.getElementById('correctCount');
    const wrongCount = document.getElementById('wrongCount');
    const resultTotal = document.getElementById('resultTotal');
    const resultMessage = document.getElementById('resultMessage');


    function showOnly(element) {
        loading.classList.add('hidden');
        error.classList.add('hidden');
        startScreen.classList.add('hidden');
        testScreen.classList.add('hidden');
        resultScreen.classList.add('hidden');

        element.classList.remove('hidden');
    }


    function escapeHtml(value) {
        return String(value ?? '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }


    async function loadQuestions() {
        try {
            const controller = new AbortController();

            const timeout = setTimeout(() => {
                controller.abort();
            }, 10000);

            const url = QUESTIONS_FILE + '?v=' + Date.now();

            const response = await fetch(url, {
                method: 'GET',
                cache: 'no-store',
                signal: controller.signal
            });

            clearTimeout(timeout);

            if (!response.ok) {
                throw new Error(
                    'Không tải được questions.json. HTTP ' + response.status
                );
            }

            const data = await response.json();

            if (!data || !Array.isArray(data.questions)) {
                throw new Error(
                    'File questions.json không đúng cấu trúc. Không tìm thấy mảng "questions".'
                );
            }

            if (data.questions.length === 0) {
                throw new Error('questions.json không có câu hỏi nào.');
            }

            questions = data.questions;

            testData = data;

            testTitle.textContent =
                data.title || 'Bài Test Đào Tạo';

            testDescription.textContent =
                data.description || '';

            totalQuestions.textContent =
                data.total_questions || questions.length;

            sopCount.textContent =
                data.sop_questions_count || 0;

            cookingCount.textContent =
                data.cooking_questions_count || 0;

            answers = new Array(questions.length).fill(null);

            showOnly(startScreen);

        } catch (error) {
            console.error(error);

            let message = error.message || 'Lỗi không xác định.';

            if (error.name === 'AbortError') {
                message =
                    'Quá thời gian chờ tải dữ liệu. Kiểm tra lại file questions.json và đường dẫn.';
            }

            if (window.location.protocol === 'file:') {
                message +=
                    '<br><br><strong>Lưu ý:</strong> Bạn đang mở HTML trực tiếp bằng file://. ' +
                    'Trình duyệt có thể chặn việc fetch questions.json. ' +
                    'Hãy chạy trang qua GitHub Pages hoặc một local server.';
            }

            errorMessage.innerHTML =
                message +
                '<br><br><small>Đường dẫn đang tải: ' +
                escapeHtml(new URL(QUESTIONS_FILE, document.baseURI).href) +
                '</small>';

            showOnly(error);
        }
    }


    function startTest() {
        const name = employeeName.value.trim();

        if (!name) {
            employeeName.focus();
            employeeName.style.borderColor = '#b42318';
            return;
        }

        employeeName.style.borderColor = '';

        currentQuestion = 0;
        answers = new Array(questions.length).fill(null);
        remainingSeconds = TEST_DURATION;
        testStartedAt = new Date().toISOString();

        showOnly(testScreen);

        renderQuestion();
        startTimer();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }


    function renderQuestion() {
        const question = questions[currentQuestion];

        if (!question) {
            submitTest();
            return;
        }

        const total = questions.length;
        const number = currentQuestion + 1;

        questionCounter.textContent =
            `Câu ${number}/${total}`;

        questionNumber.textContent =
            `CÂU ${number}`;

        progressBar.style.width =
            `${(number / total) * 100}%`;

        questionText.innerHTML =
            escapeHtml(question.question);

        options.innerHTML = '';

        const optionLetters = ['A', 'B', 'C', 'D'];

        optionLetters.forEach((letter, index) => {

            const optionText =
                question.options?.[letter] ?? '';

            const wrapper = document.createElement('div');
            wrapper.className = 'option';

            const inputId =
                `question-${currentQuestion}-option-${index}`;

            const checked =
                answers[currentQuestion] === index
                    ? 'checked'
                    : '';

            wrapper.innerHTML = `
                <input
                    type="radio"
                    id="${inputId}"
                    name="question"
                    value="${index}"
                    ${checked}
                >

                <label for="${inputId}">
                    <span class="option-letter">${letter}</span>
                    <span class="option-text">
                        ${escapeHtml(optionText)}
                    </span>
                </label>
            `;

            options.appendChild(wrapper);
        });

        questionWarning.textContent = '';

        nextButton.textContent =
            currentQuestion === total - 1
                ? 'Nộp bài'
                : 'Câu tiếp theo';

        const selected = document.querySelector(
            'input[name="question"]:checked'
        );

        if (selected) {
            selected.focus();
        }

        window.scrollTo({
            top: 0,
            behavior: 'smooth'
        });
    }


    function saveCurrentAnswer() {
        const selected =
            document.querySelector('input[name="question"]:checked');

        if (!selected) {
            questionWarning.textContent =
                'Vui lòng chọn một đáp án trước khi tiếp tục.';
            return false;
        }

        answers[currentQuestion] =
            Number(selected.value);

        questionWarning.textContent = '';

        return true;
    }


    function nextQuestion() {
        if (!saveCurrentAnswer()) {
            return;
        }

        if (currentQuestion >= questions.length - 1) {
            submitTest();
            return;
        }

        currentQuestion++;
        renderQuestion();
    }


    function startTimer() {
        stopTimer();

        updateTimer();

        timerInterval = setInterval(() => {

            remainingSeconds--;

            if (remainingSeconds <= 0) {
                remainingSeconds = 0;
                updateTimer();
                stopTimer();
                submitTest(true);
                return;
            }

            updateTimer();

        }, 1000);
    }


    function stopTimer() {
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
    }


    function updateTimer() {
        const minutes =
            Math.floor(remainingSeconds / 60)
                .toString()
                .padStart(2, '0');

        const seconds =
            (remainingSeconds % 60)
                .toString()
                .padStart(2, '0');

        timerText.textContent =
            `${minutes}:${seconds}`;

        timer.classList.remove(
            'warning',
            'danger'
        );

        if (remainingSeconds <= 60) {
            timer.classList.add('danger');
        } else if (remainingSeconds <= 180) {
            timer.classList.add('warning');
        }
    }


    function calculateResult() {
        let correct = 0;

        questions.forEach((question, index) => {

            if (
                Number.isInteger(answers[index]) &&
                answers[index] === Number(question.answer_index)
            ) {
                correct++;
            }
        });

        const total = questions.length;
        const wrong = total - correct;
        const percentage =
            total > 0
                ? Math.round((correct / total) * 100)
                : 0;

        return {
            correct,
            wrong,
            total,
            percentage
        };
    }


    async function submitTest(timeExpired = false) {

        stopTimer();

        /*
         * Nếu người dùng đang ở câu cuối và đã chọn đáp án,
         * answer đã được lưu qua nextQuestion().
         *
         * Nếu hết giờ giữa một câu, đáp án đã chọn vẫn được giữ
         * trong mảng answers vì sự kiện change không bắt buộc ở đây.
         * Do đó lưu lại lựa chọn hiện tại trước khi tính điểm.
         */
        const selected =
            document.querySelector('input[name="question"]:checked');

        if (selected && currentQuestion < answers.length) {
            answers[currentQuestion] =
                Number(selected.value);
        }

        const result = calculateResult();

        score.textContent =
            `${result.percentage}%`;

        correctCount.textContent =
            result.correct;

        wrongCount.textContent =
            result.wrong;

        resultTotal.textContent =
            result.total;

        if (timeExpired) {
            resultMessage.textContent =
                'Hết thời gian. Bài test đã được tự động nộp.';
        } else {
            resultMessage.textContent =
                'Bài test đã được ghi nhận.';
        }

        showOnly(resultScreen);

        const payload = {
            employee_name: employeeName.value.trim(),
            test_title: testData?.title || '',
            total_questions: result.total,
            correct_answers: result.correct,
            wrong_answers: result.wrong,
            score_percentage: result.percentage,
            time_expired: timeExpired,
            started_at: testStartedAt,
            submitted_at: new Date().toISOString(),
            answers: answers
        };

        if (APPS_SCRIPT_URL) {
            sendResultToAppsScript(payload);
        }
    }


    async function sendResultToAppsScript(payload) {
        try {

            await fetch(APPS_SCRIPT_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'text/plain;charset=utf-8'
                },
                body: JSON.stringify(payload)
            });

            console.log('Đã gửi kết quả tới Apps Script.');

        } catch (error) {

            console.error(
                'Không gửi được kết quả tới Apps Script:',
                error
            );

        }
    }


    startButton.addEventListener('click', startTest);

    nextButton.addEventListener('click', nextQuestion);

    employeeName.addEventListener('input', () => {
        employeeName.style.borderColor = '';
    });

    employeeName.addEventListener('keydown', event => {
        if (event.key === 'Enter') {
            event.preventDefault();
            startTest();
        }
    });

    loadQuestions();
</script>

</body>
</html>
