<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trợ lý Tascus Food</title>
<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}
html,
body {
    width: 100%;
    height: 100%;
}
body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f6f7;
    color: #333;
    overflow: hidden;
}
/* =========================
   APP
========================= */
.chat-app {
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
}
/* =========================
   HEADER
========================= */
.chat-header {
    height: 64px;
    flex: 0 0 64px;
    background: #fff;
    border-bottom: 1px solid #e5e6e8;
    display: flex;
    align-items: center;
    padding: 0 18px;
    gap: 12px;
}
.back-button {
    width: 40px;
    height: 40px;
    flex: 0 0 40px;
    border: 1px solid #dedfe2;
    border-radius: 9px;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
}
.back-button svg {
    width: 20px;
    height: 20px;
    fill: none;
    stroke: #444;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
}
.bot-avatar {
    width: 38px;
    height: 38px;
    flex: 0 0 38px;
    border-radius: 50%;
    background: #fff9e9;
    border: 1px solid #ead9a7;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #8a6c18;
    font-size: 17px;
}
.header-info {
    flex: 1;
    min-width: 0;
}
.header-info h1 {
    font-size: 16px;
    font-weight: 500;
    color: #292929;
}
.header-info p {
    margin-top: 2px;
    font-size: 11px;
    color: #888;
}
.header-status {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    color: #777;
}
.status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #75a675;
}
/* =========================
   CHAT AREA
========================= */
.chat-content {
    flex: 1;
    min-height: 0;
    display: flex;
    justify-content: center;
}
.chat-container {
    width: min(900px, 100%);
    height: 100%;
    display: flex;
    flex-direction: column;
    min-height: 0;
}
.messages {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 24px 18px;
    scroll-behavior: smooth;
}
/* =========================
   MESSAGE
========================= */
.message-row {
    display: flex;
    margin-bottom: 18px;
}
.message-row.user {
    justify-content: flex-end;
}
.message-row.bot {
    justify-content: flex-start;
}
.message {
    max-width: min(720px, 82%);
    font-size: 14px;
    line-height: 1.55;
}
.message-bubble {
    padding: 11px 14px;
    border-radius: 13px;
    white-space: pre-wrap;
    word-break: break-word;
}
.message-row.user .message-bubble {
    background: #fff8e8;
    border: 1px solid #ead9a7;
    color: #4a4129;
    border-bottom-right-radius: 4px;
}
.message-row.bot .message-bubble {
    background: #fff;
    border: 1px solid #e2e3e5;
    color: #3e3f41;
    border-bottom-left-radius: 4px;
}
.message-time {
    font-size: 10px;
    color: #aaa;
    margin-top: 5px;
}
.message-row.user .message-time {
    text-align: right;
}
/* =========================
   WELCOME
========================= */
.welcome {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 30px 20px;
}
.welcome-icon {
    width: 58px;
    height: 58px;
    border-radius: 50%;
    background: #fff9e9;
    border: 1px solid #ead9a7;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #8a6c18;
    font-size: 25px;
    margin-bottom: 15px;
}
.welcome h2 {
    font-size: 21px;
    font-weight: 500;
    color: #303033;
}
.welcome p {
    max-width: 480px;
    margin-top: 8px;
    color: #85868a;
    font-size: 13px;
    line-height: 1.5;
}
.suggestions {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 7px;
    margin-top: 20px;
}
.suggestion {
    border: 1px solid #dedfe2;
    background: #fff;
    border-radius: 9px;
    padding: 8px 11px;
    font-size: 12px;
    color: #666;
    cursor: pointer;
}
.suggestion:hover {
    background: #fafafa;
}
/* =========================
   TYPING
========================= */
.typing-bubble {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 13px 15px;
}
.typing-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #aaa;
    animation: typing 1.2s infinite ease-in-out;
}
.typing-dot:nth-child(2) {
    animation-delay: .15s;
}
.typing-dot:nth-child(3) {
    animation-delay: .3s;
}
@keyframes typing {
    0%,
    60%,
    100% {
        transform: translateY(0);
        opacity: .45;
    }
    30% {
        transform: translateY(-4px);
        opacity: 1;
    }
}
/* =========================
   INPUT
========================= */
.input-area {
    flex: 0 0 auto;
    padding: 12px 18px 16px;
    background: #f5f6f7;
}
.input-container {
    width: min(900px, 100%);
    margin: 0 auto;
    display: flex;
    align-items: flex-end;
    gap: 8px;
}
.input-box {
    flex: 1;
    min-height: 46px;
    max-height: 140px;
    resize: none;
    overflow-y: auto;
    border: 1px solid #d9dadd;
    border-radius: 12px;
    background: #fff;
    padding: 12px 13px;
    font-family: inherit;
    font-size: 14px;
    line-height: 1.4;
    color: #333;
    outline: none;
}
.input-box:focus {
    border-color: #c8b77c;
    box-shadow: 0 0 0 3px rgba(200, 183, 124, .12);
}
.send-button {
    width: 46px;
    height: 46px;
    flex: 0 0 46px;
    border: 1px solid #e4c97e;
    border-radius: 12px;
    background: #fff9e9;
    color: #8a6c18;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
}
.send-button:hover {
    background: #fff5dc;
}
.send-button:disabled {
    opacity: .45;
    cursor: default;
}
.send-button svg {
    width: 19px;
    height: 19px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
}
.disclaimer {
    width: min(900px, 100%);
    margin: 6px auto 0;
    text-align: center;
    color: #aaa;
    font-size: 10px;
}
/* =========================
   MOBILE
========================= */
@media (max-width: 700px) {
    .chat-header {
        height: 58px;
        flex-basis: 58px;
        padding: 0 10px;
        gap: 8px;
    }
    .back-button {
        width: 38px;
        height: 38px;
        flex-basis: 38px;
    }
    .bot-avatar {
        width: 34px;
        height: 34px;
        flex-basis: 34px;
        font-size: 15px;
    }
    .header-info h1 {
        font-size: 15px;
    }
    .header-info p {
        font-size: 10px;
    }
    .header-status {
        display: none;
    }
    .messages {
        padding: 16px 10px;
    }
    .message {
        max-width: 88%;
        font-size: 14px;
    }
    .input-area {
        padding: 8px 10px 10px;
    }
    .input-container {
        gap: 6px;
    }
    .input-box {
        min-height: 44px;
        border-radius: 11px;
    }
    .send-button {
        width: 44px;
        height: 44px;
        flex-basis: 44px;
        border-radius: 11px;
    }
    .disclaimer {
        font-size: 9px;
    }
    .welcome {
        padding: 20px 15px;
    }
    .welcome h2 {
        font-size: 19px;
    }
}
</style>
</head>
<body>
<div class="chat-app">
<!-- HEADER -->
<header class="chat-header">
    <button class="back-button" onclick="goBack()">
        <svg viewBox="0 0 24 24">
            <path d="M20 12H4"></path>
            <path d="M10 6L4 12L10 18"></path>
        </svg>
    </button>
    <div class="bot-avatar">
        ✦
    </div>
    <div class="header-info">
        <h1>Trợ lý Tascus Food</h1>
        <p>Trợ lý nội bộ</p>
    </div>
    <div class="header-status">
        <span class="status-dot"></span>
        Sẵn sàng
    </div>
</header>
<!-- CHAT -->
<main class="chat-content">
    <div class="chat-container">
        <div class="messages" id="messages">
            <div class="welcome" id="welcome">
                <div class="welcome-icon">
                    ✦
                </div>
                <h2>Xin chào 👋</h2>
                <p>
                    Tôi là trợ lý Tascus Food.
                    Có thể hỏi tôi về quy trình, SOP,
                    vận hành cửa hàng hoặc thông tin nội bộ.
                </p>
                <div class="suggestions">
                    <button
                        class="suggestion"
                        onclick="useSuggestion('Quy trình mở cửa hàng gồm những gì?')">
                        Quy trình mở cửa
                    </button>
                    <button
                        class="suggestion"
                        onclick="useSuggestion('Quy trình đặt bánh như thế nào?')">
                        Đặt bánh
                    </button>
                    <button
                        class="suggestion"
                        onclick="useSuggestion('Cho tôi xem các quy định vận hành quan trọng')">
                        Quy định vận hành
                    </button>
                </div>
            </div>
        </div>
        <!-- INPUT -->
        <div class="input-area">
            <div class="input-container">
                <textarea
                    id="messageInput"
                    class="input-box"
                    rows="1"
                    placeholder="Nhập câu hỏi..."
                    autocomplete="off"
                ></textarea>
                <button
                    id="sendButton"
                    class="send-button"
                    onclick="sendMessage()">
                    <svg viewBox="0 0 24 24">
                        <path d="M22 2L11 13"></path>
                        <path d="M22 2L15 22L11 13L2 9L22 2Z"></path>
                    </svg>
                </button>
            </div>
            <div class="disclaimer">
                Trợ lý AI có thể trả lời sai. Hãy kiểm tra lại thông tin quan trọng.
            </div>
        </div>
    </div>
</main>
</div>
<script> const API_URL = "https://script.google.com/macros/s/AKfycbyDGh1QDs9hS22PEU7CfwpEBmtUPVFfndHfeUjcUUWBL1_tfU61lXUkBOWIhX8w6TIb6A/exec"; const messages = document.getElementById("messages"); const input = document.getElementById("messageInput"); const sendButton = document.getElementById("sendButton"); const welcome = document.getElementById("welcome"); let isSending = false; function goBack() { if (window.history.length > 1) { window.history.back(); } else { window.location.href = "index.html"; } } function getCurrentTime() { const now = new Date(); return now.toLocaleTimeString("vi-VN", { hour: "2-digit", minute: "2-digit" }); } function escapeHtml(value) { return String(value ?? "") .replace(/&/g, "&amp;") .replace(/</g, "&lt;") .replace(/>/g, "&gt;") .replace(/"/g, "&quot;") .replace(/'/g, "&#039;"); } function addMessage(role, text) { if (welcome) { welcome.remove(); } const row = document.createElement("div"); row.className = "message-row " + role; row.innerHTML = ` <div class="message"> <div class="message-bubble"> ${escapeHtml(text)} </div> <div class="message-time"> ${getCurrentTime()} </div> </div> `; messages.appendChild(row); scrollToBottom(); } function showTyping() { const row = document.createElement("div"); row.className = "message-row bot"; row.id = "typingMessage"; row.innerHTML = ` <div class="message"> <div class="message-bubble typing-bubble"> <span class="typing-dot"></span> <span class="typing-dot"></span> <span class="typing-dot"></span> </div> </div> `; messages.appendChild(row); scrollToBottom(); } function hideTyping() { const typing = document.getElementById("typingMessage"); if (typing) { typing.remove(); } } function scrollToBottom() { requestAnimationFrame(function() { messages.scrollTop = messages.scrollHeight; }); } function useSuggestion(text) { input.value = text; autoResize(); sendMessage(); } async function sendMessage() { if (isSending) { return; } const text = input.value.trim(); if (!text) { return; } addMessage("user", text); input.value = ""; autoResize(); isSending = true; sendButton.disabled = true; showTyping(); try { const response = await fetch(API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ question: text }) }); if (!response.ok) { throw new Error( "HTTP " + response.status ); } const data = await response.json(); if (!data.success) { throw new Error( data.error || "Backend không trả về thành công." ); } hideTyping(); addMessage( "bot", data.answer || "Chatbot không trả về nội dung." ); } catch (error) { console.error( "Chatbot error:", error ); hideTyping(); addMessage( "bot", "Không thể kết nối với máy chủ chatbot.\n\n" + error.message ); } isSending = false; sendButton.disabled = false; input.focus(); } function autoResize() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 140) + "px"; } input.addEventListener( "input", autoResize ); input.addEventListener( "keydown", function(event) { if ( event.key === "Enter" && !event.shiftKey ) { event.preventDefault(); sendMessage(); } } ); input.focus(); </script>
</script>
</body>
</html>
