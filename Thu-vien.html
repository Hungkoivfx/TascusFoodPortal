<!DOCTYPE html>

<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thư viện công thức - Tascus Food</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f6f8;
    color: #222;
    overflow: hidden;
}


/* =========================================
   HEADER
========================================= */

.header {
    height: 64px;
    background: #ffffff;
    border-bottom: 1px solid #e5e7eb;

    display: flex;
    align-items: center;

    padding: 0 24px;

    position: relative;
    z-index: 10;
}

.logo {
    font-size: 21px;
    font-weight: 700;
    color: #222;
}

.logo span {
    color: #777;
    font-weight: 400;
    margin-left: 8px;
}


/* =========================================
   MAIN
========================================= */

.layout {
    display: flex;
    width: 100%;
    height: calc(100vh - 64px);
}


/* =========================================
   SIDEBAR
========================================= */

.sidebar {
    width: 250px;
    min-width: 250px;
    max-width: 250px;

    height: 100%;

    background: #ffffff;
    border-right: 1px solid #e5e7eb;

    padding: 20px 14px;

    overflow-y: auto;
}

.sidebar-title {
    height: 20px;

    font-size: 12px;
    font-weight: 700;

    color: #999;

    text-transform: uppercase;
    letter-spacing: 0.6px;

    padding: 0 12px;

    margin-bottom: 10px;
}


/* =========================================
   CATEGORY BUTTON
========================================= */

.category {
    display: block;

    width: 100%;
    height: 44px;
    min-height: 44px;
    max-height: 44px;

    border: none;

    background: transparent;

    padding: 0 12px;

    margin: 0 0 3px 0;

    border-radius: 9px;

    text-align: left;

    font-family: Arial, Helvetica, sans-serif;
    font-size: 15px;
    font-weight: 400;

    line-height: 44px;

    color: #444;

    cursor: pointer;

    transition:
        background 0.2s ease,
        color 0.2s ease;

    white-space: nowrap;
}

.category:hover {
    background: #f3f4f6;
}

.category.active {
    background: #222;
    color: #ffffff;

    font-weight: 600;

    height: 44px;
    min-height: 44px;
    max-height: 44px;

    line-height: 44px;
}


/* =========================================
   CONTENT
========================================= */

.content {
    flex: 1;

    min-width: 0;

    height: 100%;

    overflow-y: auto;

    padding: 28px 32px 50px;
}

.content-header {
    display: flex;

    align-items: center;
    justify-content: space-between;

    margin-bottom: 22px;
}

.content-title {
    font-size: 24px;
    font-weight: 700;
}

.content-count {
    font-size: 13px;
    color: #888;
}


/* =========================================
   RECIPE GRID
========================================= */

.recipe-grid {
    display: grid;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    gap: 24px;

    width: 100%;
    max-width: 1100px;
}


/* =========================================
   RECIPE CARD
========================================= */

.recipe-card {
    width: 100%;

    background: #ffffff;

    border-radius: 12px;

    overflow: hidden;

    border: 1px solid #e5e7eb;

    cursor: pointer;

    transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
}

.recipe-card:hover {
    transform: translateY(-2px);

    box-shadow:
        0 8px 25px rgba(0, 0, 0, 0.08);
}


/* =========================================
   RECIPE IMAGE
   ẢNH GỐC: 1024 × 1536
   TỶ LỆ: 2 : 3

   Không crop.
========================================= */

.recipe-image {
    display: block;

    width: 100%;
    height: auto;

    background: #f5f5f5;

    cursor: zoom-in;
}


/* =========================================
   RECIPE INFO
========================================= */

.recipe-info {
    padding: 14px 16px;
}

.recipe-name {
    font-size: 16px;
    font-weight: 600;
    line-height: 1.4;
}

.recipe-number {
    font-size: 12px;

    color: #999;

    margin-top: 5px;
}


/* =========================================
   IMAGE VIEWER
========================================= */

.viewer {
    display: none;

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    background: rgba(0, 0, 0, 0.90);

    z-index: 100;

    align-items: center;
    justify-content: center;

    padding: 20px;

    cursor: zoom-out;
}

.viewer.show {
    display: flex;
}

.viewer img {
    display: block;

    max-width: 95vw;
    max-height: 95vh;

    width: auto;
    height: auto;

    object-fit: contain;

    border-radius: 6px;
}


/* =========================================
   CLOSE BUTTON
========================================= */

.close {
    position: absolute;

    top: 20px;
    right: 28px;

    width: 42px;
    height: 42px;

    padding: 0;

    border: none;

    border-radius: 50%;

    background: rgba(255, 255, 255, 0.15);

    color: #ffffff;

    font-size: 26px;

    line-height: 42px;

    text-align: center;

    cursor: pointer;
}

.close:hover {
    background: rgba(255, 255, 255, 0.25);
}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 700px) {

    .header {
        height: 58px;

        padding: 0 16px;
    }

    .logo {
        font-size: 18px;
    }

    .logo span {
        margin-left: 5px;
    }


    .layout {
        height: calc(100vh - 58px);
    }


    .sidebar {
        width: 125px;
        min-width: 125px;
        max-width: 125px;

        padding: 14px 8px;
    }


    .sidebar-title {
        padding: 0 8px;

        font-size: 10px;

        margin-bottom: 8px;
    }


    .category {
        height: 40px;
        min-height: 40px;
        max-height: 40px;

        padding: 0 8px;

        font-size: 13px;

        line-height: 40px;
    }


    .category.active {
        height: 40px;
        min-height: 40px;
        max-height: 40px;

        line-height: 40px;
    }


    .content {
        padding: 18px 14px 40px;
    }


    .content-title {
        font-size: 20px;
    }


    .content-count {
        font-size: 11px;
    }


    /*
       MOBILE:
       1 ảnh / hàng
    */

    .recipe-grid {
        grid-template-columns: 1fr;

        gap: 16px;
    }


    .recipe-info {
        padding: 11px 13px;
    }


    .recipe-name {
        font-size: 14px;
    }

}


/* =========================================
   MOBILE NHỎ
========================================= */

@media (max-width: 450px) {

    .sidebar {
        width: 110px;
        min-width: 110px;
        max-width: 110px;
    }


    .category {
        font-size: 12px;
    }


    .content {
        padding:
            15px
            10px
            30px;
    }

}

</style>

</head>

<body>

<!-- =========================================
     HEADER
========================================= -->

<header class="header">

```
<div class="logo">

    Tascus Food

    <span>
        Thư viện công thức
    </span>

</div>
```

</header>

<div class="layout">

<!-- =========================================
     SIDEBAR
========================================= -->

<aside class="sidebar">

```
<div class="sidebar-title">
    Nhóm món
</div>


<button
    type="button"
    class="category active"
    onclick="showCategory('banhmi', this)"
>
    🥖 Bánh mì
</button>


<button
    type="button"
    class="category"
    onclick="showCategory('burger', this)"
>
    🍔 Burger
</button>


<button
    type="button"
    class="category"
    onclick="showCategory('sandwich', this)"
>
    🥪 Sandwich
</button>


<button
    type="button"
    class="category"
    onclick="showCategory('crepe', this)"
>
    🥞 Crepe
</button>


<button
    type="button"
    class="category"
    onclick="showCategory('salad', this)"
>
    🥗 Salad
</button>


<button
    type="button"
    class="category"
    onclick="showCategory('fries', this)"
>
    🍟 Khoai tây
</button>


<button
    type="button"
    class="category"
    onclick="showCategory('pasta', this)"
>
    🍝 Mỳ Ý
</button>
```

</aside>

<!-- =========================================
     CONTENT
========================================= -->

<main class="content">

```
<div class="content-header">


    <div
        class="content-title"
        id="categoryTitle"
    >
        Bánh mì
    </div>


    <div
        class="content-count"
        id="recipeCount"
    >
        5 công thức
    </div>


</div>


<div
    class="recipe-grid"
    id="recipeGrid"
></div>
```

</main>

</div>

<!-- =========================================
     IMAGE VIEWER
========================================= -->

<div
    class="viewer"
    id="viewer"
    onclick="closeViewer(event)"
>

```
<button
    type="button"
    class="close"
    onclick="closeViewer(event)"
>
    ×
</button>


<img
    id="viewerImage"
    src=""
    alt="Công thức"
>
```

</div>

<script>


/* =====================================================
   DỮ LIỆU CÔNG THỨC

   TẤT CẢ ẢNH NẰM Ở ROOT CỦA GITHUB.

   Ví dụ:

   index.html
   BM-BMganuongsa.png
   BM-BMXucxichbobamhamphomai.png

===================================================== */


const recipes = {


    /* =====================================
       BÁNH MÌ
    ===================================== */

    banhmi: {

        title: "Bánh mì",

        items: [

            {
                name: "Bánh mì gà nướng sả",
                image: "BM-BMganuongsa.png"
            },

            {
                name: "Bánh mì xúc xích bò bằm hầm phô mai",
                image: "BM-BMXucxichbobamhamphomai.png"
            },

            {
                name: "Bánh mì heo nướng xá xíu",
                image: "BM-BMheonuongxaxiu.png"
            },

            {
                name: "Bánh mì bò phô mai",
                image: "BM-BMbophomai.png"
            },

            {
                name: "Bánh mì bò tiêu đen",
                image: "BM-BMbotieuden.png"
            }

        ]

    },


    /* =====================================
       BURGER
    ===================================== */

    burger: {

        title: "Burger",

        items: [

            {
                name: "Burger",
                image: "burger.png"
            }

        ]

    },


    /* =====================================
       SANDWICH
    ===================================== */

    sandwich: {

        title: "Sandwich",

        items: [

            {
                name: "Sandwich xúc xích phô mai",
                image: "Sanwich-Sandwichxucxichphomai.png"
            },

            {
                name: "Sandwich jambon phô mai",
                image: "Sanwich-Sandwichjambonphomai.png"
            },

            {
                name: "Sandwich phô mai pate heo",
                image: "Sanwich-Sandwichphomaipateheo.png"
            },

            {
                name: "Sandwich phô mai pate bò",
                image: "Sanwich-Sandwichphomaipatebo.png"
            },

            {
                name: "Sandwich phô mai sô cô la",
                image: "Sandwich-Sanwichphomaisocola.png"
            }

        ]

    },


    /* =====================================
       CREPE
    ===================================== */

    crepe: {

        title: "Crepe",

        items: [

            {
                name: "Crepe xúc xích phô mai",
                image: "Crepe-Crepexucxicphomai.png"
            },

            {
                name: "Crepe jambon",
                image: "Crepe-Crepejambon.png"
            }

        ]

    },


    /* =====================================
       SALAD
    ===================================== */

    salad: {

        title: "Salad",

        items: [

            {
                name: "Salad gà viên",
                image: "Salad-gavien.png"
            },

            {
                name: "Salad rau củ",
                image: "Salad-raucu.png"
            }

        ]

    },


    /* =====================================
       KHOAI TÂY
    ===================================== */

    fries: {

        title: "Khoai tây",

        items: [

            {
                name: "Khoai tây chiên",
                image: "Khoaitaychien.png"
            }

        ]

    },


    /* =====================================
       MỲ Ý
    ===================================== */

    pasta: {

        title: "Mỳ Ý",

        items: [

            {
                name: "Mỳ Ý xúc xích bò bằm",
                image: "Pasta-MyYsotbobam.png"
            }

        ]

    }

};



/* =====================================================
   HIỂN THỊ NHÓM MÓN
===================================================== */

function showCategory(category, button) {


    const data = recipes[category];


    if (!data) {
        return;
    }


    /* Tên nhóm */

    document.getElementById(
        "categoryTitle"
    ).textContent = data.title;


    /* Số lượng */

    document.getElementById(
        "recipeCount"
    ).textContent =
        data.items.length + " công thức";


    /* Active button */

    document
        .querySelectorAll(".category")
        .forEach(function(btn) {

            btn.classList.remove("active");

        });


    button.classList.add("active");


    /* Grid */

    const grid =
        document.getElementById(
            "recipeGrid"
        );


    grid.innerHTML = "";


    /* Tạo card */

    data.items.forEach(
        function(item, index) {


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "recipe-card";


            const image =
                document.createElement(
                    "img"
                );


            image.className =
                "recipe-image";


            image.src =
                item.image;


            image.alt =
                item.name;


            image.loading =
                "lazy";


            image.onclick =
                function(event) {

                    event.stopPropagation();

                    openViewer(
                        item.image
                    );

                };


            const info =
                document.createElement(
                    "div"
                );


            info.className =
                "recipe-info";


            const name =
                document.createElement(
                    "div"
                );


            name.className =
                "recipe-name";


            name.textContent =
                item.name;


            const number =
                document.createElement(
                    "div"
                );


            number.className =
                "recipe-number";


            number.textContent =
                "Công thức " +
                (index + 1);


            info.appendChild(name);

            info.appendChild(number);


            card.appendChild(image);

            card.appendChild(info);


            grid.appendChild(card);

        }
    );

}



/* =====================================================
   MỞ ẢNH
===================================================== */

function openViewer(image) {


    document.getElementById(
        "viewerImage"
    ).src = image;


    document.getElementById(
        "viewer"
    ).classList.add("show");


    document.body.style.overflow =
        "hidden";

}



/* =====================================================
   ĐÓNG ẢNH
===================================================== */

function closeViewer(event) {


    if (
        !event ||
        event.target.id === "viewer" ||
        event.target.classList.contains("close")
    ) {


        document.getElementById(
            "viewer"
        ).classList.remove("show");


        document.body.style.overflow =
            "hidden";

    }

}



/* =====================================================
   ESC ĐỂ ĐÓNG ẢNH
===================================================== */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Escape"
        ) {

            document.getElementById(
                "viewer"
            ).classList.remove("show");

        }

    }
);



/* =====================================================
   LOAD MẶC ĐỊNH
===================================================== */

showCategory(
    "banhmi",
    document.querySelector(
        ".category.active"
    )
);


</script>

</body>
</html>
