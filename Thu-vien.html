<!DOCTYPE html>

<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thư viện công thức - Tascus Food</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: Arial, Helvetica, sans-serif;
        background: #f5f6f8;
        color: #222;
        height: 100vh;
        overflow: hidden;
    }

    /* HEADER */
    .header {
        height: 64px;
        background: #ffffff;
        border-bottom: 1px solid #e5e7eb;
        display: flex;
        align-items: center;
        padding: 0 24px;
        position: relative;
        z-index: 10;
    }

    .logo {
        font-size: 21px;
        font-weight: 700;
        color: #222;
    }

    .logo span {
        color: #777;
        font-weight: 400;
        margin-left: 8px;
    }

    /* MAIN */
    .layout {
        display: flex;
        height: calc(100vh - 64px);
    }

    /* SIDEBAR */
    .sidebar {
        width: 250px;
        min-width: 250px;
        background: #ffffff;
        border-right: 1px solid #e5e7eb;
        padding: 20px 14px;
        overflow-y: auto;
    }

    .sidebar-title {
        font-size: 12px;
        font-weight: 700;
        color: #999;
        text-transform: uppercase;
        letter-spacing: 0.6px;
        padding: 0 12px;
        margin-bottom: 10px;
    }

    .category {
        width: 100%;
        border: none;
        background: transparent;
        padding: 13px 12px;
        margin-bottom: 3px;
        border-radius: 9px;
        text-align: left;
        font-size: 15px;
        color: #444;
        cursor: pointer;
        transition: 0.2s;
    }

    .category:hover {
        background: #f3f4f6;
    }

    .category.active {
        background: #222;
        color: #fff;
        font-weight: 600;
    }

    /* CONTENT */
    .content {
        flex: 1;
        overflow-y: auto;
        padding: 28px 32px 50px;
    }

    .content- {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 22px;
    }

    .content-title {
        font-size: 24px;
        font-weight: 700;
    }

    .content-count {
        font-size: 13px;
        color: #888;
    }

    /* IMAGE GRID */
    .recipe-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 22px;
        max-width: 1100px;
    }

    .recipe-card {
        background: #ffffff;
        border-radius: 12px;
        overflow: hidden;
        border: 1px solid #e5e7eb;
        cursor: pointer;
        transition: 0.2s;
    }

    .recipe-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(0,0,0,0.08);
    }

    .recipe-image {
        width: 100%;
        aspect-ratio: 16 / 10;
        object-fit: cover;
        display: block;
        background: #eee;
    }

    .recipe-info {
        padding: 14px 16px;
    }

    .recipe-name {
        font-size: 16px;
        font-weight: 600;
    }

    .recipe-number {
        font-size: 12px;
        color: #999;
        margin-top: 5px;
    }

    /* IMAGE VIEWER */
    .viewer {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.88);
        z-index: 100;
        align-items: center;
        justify-content: center;
        padding: 30px;
    }

    .viewer.show {
        display: flex;
    }

    .viewer img {
        max-width: 95%;
        max-height: 90vh;
        object-fit: contain;
        border-radius: 6px;
    }

    .close {
        position: absolute;
        top: 20px;
        right: 28px;
        width: 42px;
        height: 42px;
        border-radius: 50%;
        border: none;
        background: rgba(255,255,255,0.15);
        color: white;
        font-size: 26px;
        cursor: pointer;
    }

    .close:hover {
        background: rgba(255,255,255,0.25);
    }

    /* MOBILE */
    @media (max-width: 700px) {
.back-button { width: 36px; height: 36px; margin-right: 9px; font-size: 21px; }
        body {
            overflow: hidden;
        }

        .header {
            height: 58px;
            padding: 0 16px;
        }

        .logo {
            font-size: 18px;
        }

        .layout {
            height: calc(100vh - 58px);
        }

        .sidebar {
            width: 125px;
            min-width: 125px;
            padding: 14px 8px;
        }

        .sidebar-title {
            padding: 0 8px;
            font-size: 10px;
        }

        .category {
            padding: 11px 8px;
            font-size: 13px;
        }

        .content {
            padding: 18px 14px 40px;
        }

        .content-title {
            font-size: 20px;
        }

        .content-count {
            font-size: 11px;
        }

        .recipe-grid {
            grid-template-columns: 1fr;
            gap: 16px;
        }

        .recipe-info {
            padding: 11px 13px;
        }
       .back-button {

</style>

</head>

<body>

<header class="header">

```
<button
    type="button"
    class="back-button"
    onclick="window.location.href='index.html'"
>
    ←
</button>

<div class="logo">

    Tascus Food

    <span>

```

</header>


<div class="layout">


<!-- CỘT TRÁI -->
<aside class="sidebar">

    <div class="sidebar-title">
        Nhóm món
    </div>

    <button class="category active" onclick="showCategory('banhmi', this)">
        🥖 Bánh mì
    </button>

    <button class="category" onclick="showCategory('burger', this)">
        🍔 Burger
    </button>

    <button class="category" onclick="showCategory('sandwich', this)">
        🥪 Sandwich
    </button>

    <button class="category" onclick="showCategory('crepe', this)">
        🥞 Crepe
    </button>

    <button class="category" onclick="showCategory('salad', this)">
        🥗 Salad
    </button>

    <button class="category" onclick="showCategory('fries', this)">
        🍟 Khoai tây
    </button>

</aside>


<!-- CỘT PHẢI -->
<main class="content">

    <div class="content-header">

        <div>
            <div class="content-title" id="categoryTitle">
                Bánh mì
            </div>
        </div>

        <div class="content-count" id="recipeCount">
            4 công thức
        </div>

    </div>

    <div class="recipe-grid" id="recipeGrid"></div>

</main>


</div>

<!-- XEM ẢNH LỚN -->

<div class="viewer" id="viewer" onclick="closeViewer(event)">


<button class="close" onclick="closeViewer()">
    ×
</button>

<img id="viewerImage" src="" alt="Công thức">


</div>

<script>

/*
====================================================
DỮ LIỆU CÔNG THỨC
====================================================

Sau này bạn chỉ cần thay URL ảnh ở đây.

Ví dụ:

{
    name: "Bánh mì gà",
    image: "https://....../banh-mi-ga.jpg"
}

====================================================
*/

const recipes = {

banhmi: {

    title: "Bánh mì",

    items: [

        {
            name: "Bánh mì gà nướng sả",
            image: "BM-BMganuongsa.png"
        },

        {
            name: "Bánh mì xúc xích bò bằm hầm phô mai",
            image: "BM-BMXucxichbobamhamphomai.png"
        },

        {
            name: "Bánh mì heo nướng xá xíu",
            image: "BM-BMheonuongxaxiu.png"
        },

        {
            name: "Bánh mì bò phô mai",
            image: "BM-BMbophomai.png"
        },

        {
            name: "Bánh mì bò tiêu đen",
            image: "BM-BMbotieuden.png"
        }

    ]

},


burger: {

    title: "Burger",

    items: [

        {
            name: "Burger",
            image: "burger.png"
        }

    ]

},


sandwich: {

    title: "Sandwich",

    items: [

        {
            name: "Sandwich xúc xích phô mai",
            image: "Sanwich-Sandwichxucxichphomai.png"
        },

        {
            name: "Sandwich jambon phô mai",
            image: "Sanwich-Sandwichjambonphomai.png"
        },

        {
            name: "Sandwich phô mai pate heo",
            image: "Sanwich-Sandwichphomaipateheo.png"
        },

        {
            name: "Sandwich phô mai pate bò",
            image: "Sanwich-Sandwichphomaipatebo.png"
        },

        {
            name: "Sandwich phô mai sô cô la",
            image: "Sandwich-Sanwichphomaisocola.png"
        }

    ]

},


crepe: {

    title: "Crepe",

    items: [

        {
            name: "Crepe xúc xích phô mai",
            image: "Crepe-Crepexucxicphomai.png"
        },

        {
            name: "Crepe jambon",
            image: "Crepe-Crepejambon.png"
        }

    ]

},


salad: {

    title: "Salad",

    items: [

        {
            name: "Salad gà viên",
            image: "Salad-gavien.png"
        },

        {
            name: "Salad combo No Nê một ghế",
            image: "Salad-none.png"
        }

    ]

},


fries: {

    title: "Khoai tây",

    items: [

        {
            name: "Khoai tây chiên",
            image: "Khoaitaychien.png"
        }

    ]

},


pasta: {

    title: "Mỳ Ý",

    items: [

        {
            name: "Mỳ Ý xúc xích bò bằm",
            image: "Pasta-MyYsotbobam.png"
        }

    ]

},


drink: {

    title: "Đồ uống",

    items: [

        {
            name: "Công thức đồ uống",
            image: "Douong.png"
        }

    ]

}

};

/*
====================================================
HIỂN THỊ NHÓM MÓN
====================================================
*/

function showCategory(category, button) {

    const data = recipes[category];

    document.getElementById("categoryTitle").textContent = data.title;

    document.getElementById("recipeCount").textContent =
        data.items.length + " công thức";

    document.querySelectorAll(".category").forEach(btn => {
        btn.classList.remove("active");
    });

    button.classList.add("active");

    const grid = document.getElementById("recipeGrid");

    grid.innerHTML = "";

    data.items.forEach((item, index) => {

        const card = document.createElement("div");

        card.className = "recipe-card";

        card.innerHTML = `
            <img
                class="recipe-image"
                src="${item.image}"
                alt="${item.name}"
                loading="lazy"
                onclick="openViewer('${item.image}')"
            >

            <div class="recipe-info">
                <div class="recipe-name">
                    ${item.name}
                </div>

                <div class="recipe-number">
                    Công thức ${index + 1}
                </div>
            </div>
        `;

        grid.appendChild(card);

    });

}


/*
====================================================
MỞ ẢNH LỚN
====================================================
*/

function openViewer(image) {

    document.getElementById("viewerImage").src = image;

    document.getElementById("viewer").classList.add("show");

}


/*
====================================================
ĐÓNG ẢNH
====================================================
*/

function closeViewer(event) {

    if (
        !event ||
        event.target.id === "viewer" ||
        event.target.classList.contains("close")
    ) {

        document.getElementById("viewer").classList.remove("show");

    }

}


/*
====================================================
LOAD MẶC ĐỊNH
====================================================
*/

showCategory(
    "banhmi",
    document.querySelector(".category.active")
);

</script>
