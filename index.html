<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nhật ký vận hành - Tascus Food</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            background: #f5f6f7;
            color: #222;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 24px 16px;
        }

        .container {
            width: 100%;
            max-width: 620px;
        }

        /* ===== HEADER ===== */

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo {
            width: 58px;
            height: 58px;

            margin: 0 auto 16px;

            border-radius: 16px;

            background: #ffffff;
            border: 1px solid #e1e3e5;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 27px;
        }

        .header h1 {
            font-size: 26px;
            font-weight: 650;
            letter-spacing: -0.4px;

            margin-bottom: 8px;
        }

        .header p {
            font-size: 14px;
            line-height: 1.55;
            color: #777;
        }

        /* ===== MENU ===== */

        .menu {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .menu-button {
            width: 100%;
            min-height: 108px;

            display: flex;
            align-items: center;

            padding: 22px 20px;

            background: #ffffff;
            border: 1px solid #e1e3e5;
            border-radius: 16px;

            text-decoration: none;
            color: inherit;

            transition:
                transform 0.15s ease,
                box-shadow 0.15s ease,
                border-color 0.15s ease;

            -webkit-tap-highlight-color: transparent;
        }

        .menu-button:hover {
            border-color: #cfd2d5;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
            transform: translateY(-1px);
        }

        .menu-button:active {
            transform: scale(0.985);
            box-shadow: none;
        }

        /* ===== ICON ===== */

        .button-icon {
            width: 48px;
            height: 48px;

            flex-shrink: 0;

            border-radius: 13px;

            background: #f1f2f3;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 22px;

            margin-right: 16px;
        }

        /* ===== TEXT ===== */

        .button-content {
            flex: 1;
            min-width: 0;
        }

        .button-title {
            font-size: 17px;
            font-weight: 600;

            margin-bottom: 6px;
        }

        .button-description {
            font-size: 13px;
            line-height: 1.5;

            color: #777;
        }

        .arrow {
            flex-shrink: 0;

            margin-left: 14px;

            font-size: 22px;
            color: #999;
        }

        /* ===== FOOTER ===== */

        .footer {
            text-align: center;

            margin-top: 24px;

            font-size: 12px;
            color: #999;
        }

        /* ===== MOBILE ===== */

        @media (max-width: 600px) {

            body {
                align-items: flex-start;

                padding-top: max(32px, env(safe-area-inset-top));
                padding-bottom: max(24px, env(safe-area-inset-bottom));
            }

            .container {
                max-width: 480px;
                margin: auto 0;
            }

            .header {
                margin-bottom: 24px;
            }

            .logo {
                width: 54px;
                height: 54px;

                margin-bottom: 14px;

                border-radius: 15px;

                font-size: 25px;
            }

            .header h1 {
                font-size: 23px;
            }

            .header p {
                font-size: 13px;
            }

            .menu {
                gap: 12px;
            }

            .menu-button {
                min-height: 96px;

                padding: 18px 16px;

                border-radius: 15px;
            }

            .button-icon {
                width: 46px;
                height: 46px;

                margin-right: 13px;

                border-radius: 12px;

                font-size: 21px;
            }

            .button-title {
                font-size: 15px;
            }

            .button-description {
                font-size: 12.5px;
            }

            .arrow {
                font-size: 20px;
                margin-left: 10px;
            }

            .footer {
                margin-top: 20px;
            }
        }

        /* ===== SMALL PHONE ===== */

        @media (max-width: 360px) {

            body {
                padding-left: 12px;
                padding-right: 12px;
            }

            .header h1 {
                font-size: 21px;
            }

            .header p {
                font-size: 12.5px;
            }

            .menu-button {
                padding: 16px 13px;
            }

            .button-icon {
                width: 42px;
                height: 42px;

                margin-right: 11px;

                font-size: 19px;
            }

            .button-title {
                font-size: 14px;
            }

            .button-description {
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <header class="header">

            <div class="logo">
                📋
            </div>

            <h1>Nhật ký vận hành</h1>

            <p>
                Ghi nhận và cập nhật các vấn đề<br>
                phát sinh trong quá trình vận hành.
            </p>

        </header>


        <section class="menu">

            <!-- BÁO CÁO VẤN ĐỀ MỚI -->

            <a
                class="menu-button"
                href="DÁN-LINK-FORM-BÁO-CÁO-VÀO-ĐÂY"
            >

                <div class="button-icon">
                    ＋
                </div>

                <div class="button-content">

                    <div class="button-title">
                        Báo cáo vấn đề mới
                    </div>

                    <div class="button-description">
                        Ghi nhận sự việc hoặc vấn đề
                        vừa phát sinh tại cửa hàng.
                    </div>

                </div>

                <div class="arrow">
                    ›
                </div>

            </a>


            <!-- CẬP NHẬT VẤN ĐỀ CŨ -->

            <a
                class="menu-button"
                href="DÁN-LINK-FORM-CẬP-NHẬT-VÀO-ĐÂY"
            >

                <div class="button-icon">
                    ↻
                </div>

                <div class="button-content">

                    <div class="button-title">
                        Cập nhật vấn đề
                    </div>

                    <div class="button-description">
                        Cập nhật tình trạng các vấn đề
                        đã được ghi nhận.
                    </div>

                </div>

                <div class="arrow">
                    ›
                </div>

            </a>

        </section>


        <footer class="footer">
            Tascus Food · Nhật ký vận hành
        </footer>

    </main>

</body>
</html>
