
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Giấy note nhắc việc</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: #e9e9e6;
    font-family: Arial, sans-serif;
}

.scene {
    position: relative;
    width: min(368px, calc(100vw - 24px));
    aspect-ratio: 368 / 551;
    flex-shrink: 0;
}

.paper {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    background-image: url("./note.png");
    background-size: 100% 100%;
    background-repeat: no-repeat;
    transform: translateY(-4%);
}

/* Tiêu đề */
.note-title {
    position: absolute;
    top: 21.7%;
    left: 8.97%;
    right: 8.97%;
    margin: 0;
    text-align: left;
    font-size: 17px;
    font-weight: 700;
    color: #57351f;
    line-height: 1.35;
}

/* Nội dung */
.note-content {
    position: absolute;
    top: 28%;
    left: 8.97%;
    right: 8.97%;
    bottom: 12%;
    overflow-y: auto;
    color: #453a32;
    font-size: 14px;
    line-height: 1.3;
    white-space: pre-wrap;
    overflow-wrap: break-word;
}

/* Nút xác nhận */
.confirm-button {
    position: absolute;
    width: 25%;
    right: 12%;
    bottom: 7%;
    padding: 0;
    border: 0;
    background: transparent;
    cursor: pointer;
    z-index: 2;
    -webkit-tap-highlight-color: transparent;

    transform: scale(1) translateY(0);
    transform-origin: center;
    transition: transform 180ms cubic-bezier(0.2, 0.8, 0.2, 1);
    user-select: none;
    touch-action: manipulation;
}

.confirm-button img {
    display: block;
    width: 130%;
    height: auto;
    object-fit: contain;
    pointer-events: none;
}

/* Hiệu ứng nhấn */
.confirm-button:active {
    transform: scale(0.88) translateY(4px);
    transition: transform 80ms ease-out;
}
</style>
</head>

<body>

<div class="scene" id="reminder">

    <div class="paper"></div>

    <!-- Tiêu đề cố định -->
    <h1 class="note-title" id="noteTitle">
        HÔM NAY CÓ GÌ, LÀM GÌ!
    </h1>

    <!-- Nội dung tải từ ducksnote.json -->
    <div class="note-content" id="noteContent">
        Đang tải nội dung...
    </div>

    <!-- Nút xác nhận -->
    <button
        class="confirm-button"
        id="confirmButton"
        aria-label="Đã rõ"
        type="button"
    >
        <img src="./okay.png" alt="Đã rõ">
    </button>

</div>

<script>

// =====================================
// ĐỌC NỘI DUNG TỪ DUCKSNOTE.JSON
// =====================================

async function loadNote() {

    const content = document.getElementById("noteContent");

    try {

        const response = await fetch(
            "./ducksnote.json?t=" + Date.now(),
            { cache: "no-store" }
        );

        if (!response.ok) {
            throw new Error("Không thể tải ducksnote.json");
        }

        const data = await response.json();

        if (typeof data.content !== "string") {
            throw new Error("Dữ liệu content không hợp lệ");
        }

        content.textContent = data.content;

    } catch (error) {

        console.error("Lỗi tải note:", error);

        content.textContent =
            "Không thể tải nội dung nhắc việc.\nVui lòng thử tải lại trang.";

    }

}


// =====================================
// NÚT XÁC NHẬN
// =====================================

const confirmButton = document.getElementById("confirmButton");

let isPressed = false;

confirmButton.addEventListener("pointerdown", () => {
    isPressed = true;
});

confirmButton.addEventListener("pointerup", () => {

    if (!isPressed) return;

    isPressed = false;

    window.location.href = "./index.html";

});

confirmButton.addEventListener("pointercancel", () => {
    isPressed = false;
});


// =====================================
// KHỞI CHẠY
// =====================================

loadNote();

</script>

</body>
</html>
