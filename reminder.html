<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thông báo</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: #e9e9e6;
    font-family: Arial, sans-serif;
}

.scene {
    position: relative;
    width: min(368px, calc(100vw - 24px));
    aspect-ratio: 368 / 551;
    flex-shrink: 0;
}

.paper {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    background-image: url("./note.png");
    background-size: 100% 100%;
    background-repeat: no-repeat;
}

/* Tiêu đề: cách mép trên 188px */
.note-title {
    position: absolute;
    top: 34.12%;
    left: 8.97%;
    right: 8.97%;
    margin: 0;
    text-align: center;
    font-size: 17px;
    font-weight: 700;
    color: #57351f;
    line-height: 1.35;
}

/* Nội dung: cách mép trái 33px */
.note-content {
    position: absolute;
    top: 42%;
    left: 8.97%;
    right: 8.97%;
    bottom: 12%;
    overflow-y: auto;
    color: #453a32;
    font-size: 14px;
    line-height: 1.65;
    white-space: pre-wrap;
    overflow-wrap: break-word;
}

/* Nút nằm tại góc 4 giờ */
.confirm-button {
    position: absolute;
    width: 25%;
    right: -3%;
    bottom: -1%;
    padding: 0;
    border: 0;
    background: transparent;
    cursor: pointer;
    z-index: 2;
    -webkit-tap-highlight-color: transparent;
}

.confirm-button img {
    display: block;
    width: 100%;
    height: auto;
    object-fit: contain;
}

.confirm-button:active {
    transform: scale(0.94);
}

.hidden {
    display: none;
}
</style>
</head>

<body>

<div class="scene" id="reminder">

    <div class="paper"></div>

    <h1 class="note-title" id="noteTitle">
        THÔNG BÁO
    </h1>

    <div class="note-content" id="noteContent">Đây là nội dung thông báo mẫu.

Nội dung thực tế sẽ được tải từ hệ thống sau khi tích hợp backend.</div>

    <button
        class="confirm-button"
        id="confirmButton"
        aria-label="Đã rõ"
        type="button"
    >
        <img src="./okay.png" alt="Đã rõ">
    </button>

</div>

<script>
document.getElementById("confirmButton").addEventListener("click", () => {
    document.getElementById("reminder").classList.add("hidden");
});
</script>

</body>
</html>
